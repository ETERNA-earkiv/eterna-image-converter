image-converter.jpg.title = JPG
image-converter.jpg.description = Ett förlustkomprimerande format som är idealiskt för fotografier och komplexa bilder där viss kvalitetsförlust accepteras för mindre filstorlekar. Rekommenderas inte för arkivering av bilder där kvalitet är av högsta prioritet.

image-converter.png.title = PNG
image-converter.png.description = Ett förlustfritt komprimerande format som passar bra för bilder med skarpa linjer, text och grafik. Det bevarar bildkvaliteten under komprimering och är ett bra val för arkivering av digital konst, logotyper och skärmdumpar.

image-converter.tiff.title = TIFF
image-converter.tiff.description = Ett flexibelt bildformat som kan lagra bilder med förlustfri komprimering (eller ingen komprimering alls). Det är idealiskt för arkivering eftersom det bevarar maximal bildkvalitet och stöder metadata. Resulterar i större filstorlekar.