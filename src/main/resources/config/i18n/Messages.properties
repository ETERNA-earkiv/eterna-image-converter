image-converter.jpg.title = JPG
image-converter.jpg.description = A lossy compression format ideal for photographs and complex images where some quality loss is acceptable for smaller file sizes. Not recommended for archival of images where quality is paramount.

image-converter.png.title = PNG
image-converter.png.description = PNGA lossless compression format well-suited for images with sharp lines, text, and graphics. It preserves image quality during compression and is a good choice for archival of digital art, logos, and screenshots.

image-converter.tiff.title = TIFF
image-converter.tiff.description = A flexible image format that can store images with lossless compression (or no compression at all). It is ideal for archival purposes because it preserves maximum image quality and supports metadata. Results in larger file sizes.